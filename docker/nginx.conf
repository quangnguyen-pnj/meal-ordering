# Same-domain reverse proxy (plan section 6): / goes to the web app, /api to the API.
# The browser only ever talks to this server; the API is the only component that calls DMP and Entra.

upstream meal_web {
    server web:3000;
}

upstream meal_api {
    server api:3001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m; # Excel mapping imports arrive in a later phase

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://meal_api;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://meal_web;
    }
}
